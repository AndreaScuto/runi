name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@andreascuto"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e "const p=require('./package.json'); const expected=process.env.RELEASE_TAG.replace(/^v/, ''); if (p.version !== expected) throw new Error('package.json version ' + p.version + ' does not match release ' + expected)"
      - run: pnpm run check
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
